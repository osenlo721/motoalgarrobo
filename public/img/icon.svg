<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#1A6B2F" rx="60"/>
  <!-- Rueda trasera -->
  <circle cx="160" cy="320" r="90" fill="none" stroke="#fff" stroke-width="18"/>
  <circle cx="160" cy="320" r="12" fill="#fff"/>
  <line x1="160" y1="230" x2="160" y2="410" stroke="#fff" stroke-width="8" opacity="0.5"/>
  <line x1="70" y1="320" x2="250" y2="320" stroke="#fff" stroke-width="8" opacity="0.5"/>
  <line x1="96" y1="256" x2="224" y2="384" stroke="#fff" stroke-width="8" opacity="0.5"/>
  <line x1="224" y1="256" x2="96" y2="384" stroke="#fff" stroke-width="8" opacity="0.5"/>
  <!-- Rueda delantera -->
  <circle cx="370" cy="320" r="78" fill="none" stroke="#fff" stroke-width="18"/>
  <circle cx="370" cy="320" r="12" fill="#fff"/>
  <line x1="370" y1="242" x2="370" y2="398" stroke="#fff" stroke-width="8" opacity="0.5"/>
  <line x1="292" y1="320" x2="448" y2="320" stroke="#fff" stroke-width="8" opacity="0.5"/>
  <!-- Cuerpo moto -->
  <path d="M175 315 L210 240 L310 228 L355 255 L365 290 L355 315 Z" fill="#F5D800"/>
  <!-- Motor -->
  <rect x="215" y="262" width="100" height="62" rx="10" fill="#1A6B2F" stroke="#fff" stroke-width="4"/>
  <!-- Manillar -->
  <path d="M350 255 L395 225 L410 228" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
  <!-- Faro -->
  <ellipse cx="412" cy="230" rx="16" ry="12" fill="#F5D800"/>
  <!-- Escape -->
  <path d="M178 315 Q165 335 148 340" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
  <!-- Lineas velocidad -->
  <line x1="60" y1="295" x2="120" y2="295" stroke="#F5D800" stroke-width="6" opacity="0.7" stroke-linecap="round"/>
  <line x1="55" y1="315" x2="112" y2="315" stroke="#F5D800" stroke-width="4" opacity="0.5" stroke-linecap="round"/>
  <!-- Texto -->
  <text x="256" y="430" text-anchor="middle" font-family="Georgia,serif" font-size="72" font-weight="700" fill="#F5D800" letter-spacing="4">MOTO</text>
  <text x="256" y="478" text-anchor="middle" font-family="Georgia,serif" font-size="38" font-weight="400" fill="#fff" letter-spacing="10">ALGARROBO</text>
</svg>
