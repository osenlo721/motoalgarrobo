<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#1A1A1A"/>
  <title>MotoAlgarrobo - Admin</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',sans-serif; background:#0F0F0F; color:#fff; min-height:100vh; }

    /* LOGIN */
    #login-screen {
      min-height:100vh; display:flex; flex-direction:column;
      align-items:center; justify-content:center; background:#1A6B2F;
    }
    .login-logo { font-size:36px; font-weight:900; color:#F5D800; letter-spacing:3px; font-family:Georgia,serif; margin-bottom:4px; }
    .login-sub { font-size:12px; color:#9FE1CB; letter-spacing:6px; margin-bottom:32px; }
    .login-card { background:#fff; border-radius:20px; padding:28px 24px; width:90%; max-width:320px; }
    .login-card h3 { font-size:14px; color:#5F5E5A; text-align:center; margin-bottom:18px; }
    .login-card input {
      width:100%; padding:12px 14px; border-radius:10px;
      border:1.5px solid #D3D1C7; font-size:14px;
      background:#F1EFE8; outline:none; margin-bottom:14px;
    }
    .login-card input:focus { border-color:#1A6B2F; }
    .btn-login {
      width:100%; padding:13px; background:#1A6B2F; color:#fff;
      border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer;
    }
    .login-error { color:#E24B4A; font-size:12px; text-align:center; margin-top:10px; display:none; }

    /* ADMIN */
    #admin-screen { display:none; }

    header {
      background:#1A1A1A; border-bottom:1px solid #2A2A2A;
      padding:12px 20px; display:flex; align-items:center; justify-content:space-between;
    }
    .header-brand { font-size:16px; font-weight:800; color:#F5D800; }
    .header-brand span { color:#fff; font-weight:400; font-size:13px; margin-left:8px; }
    .btn-logout { background:transparent; border:1px solid #333; color:#888; padding:6px 12px; border-radius:8px; cursor:pointer; font-size:12px; }

    .layout { display:flex; height:calc(100vh - 49px); }

    /* SIDEBAR */
    .sidebar {
      width:340px; min-width:300px; background:#141414;
      border-right:1px solid #222; display:flex; flex-direction:column;
      overflow:hidden;
    }

    .stats-bar {
      display:flex; gap:1px; background:#222; border-bottom:1px solid #222;
    }
    .stat-item {
      flex:1; background:#141414; padding:12px 8px; text-align:center;
    }
    .stat-item .v { font-size:20px; font-weight:800; color:#F5D800; }
    .stat-item .l { font-size:10px; color:#555; margin-top:2px; }

    .tabs { display:flex; border-bottom:1px solid #222; }
    .tab {
      flex:1; padding:10px; text-align:center; font-size:12px; font-weight:700;
      color:#555; cursor:pointer; border-bottom:2px solid transparent;
    }
    .tab.active { color:#F5D800; border-bottom-color:#F5D800; }

    .lista { flex:1; overflow-y:auto; padding:12px; }
    .lista::-webkit-scrollbar { width:4px; }
    .lista::-webkit-scrollbar-track { background:#141414; }
    .lista::-webkit-scrollbar-thumb { background:#333; border-radius:4px; }

    /* Cards */
    .carrera-card {
      background:#1E1E1E; border-radius:12px; padding:14px;
      margin-bottom:10px; border:1px solid #2A2A2A; cursor:pointer;
      transition:.2s;
    }
    .carrera-card:hover { border-color:#F5D800; }
    .carrera-card.selected { border-color:#F5D800; background:#252500; }

    .cc-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
    .cc-id { font-size:10px; color:#555; font-family:monospace; }
    .cc-badge {
      font-size:10px; font-weight:700; padding:3px 8px; border-radius:20px;
    }
    .badge-buscando { background:#2A1F00; color:#F5D800; }
    .badge-aceptada { background:#0A2A1A; color:#4ADE80; }
    .badge-recogido { background:#0A1A2A; color:#60A5FA; }
    .badge-cliente_confirmo { background:#1A0A2A; color:#C084FC; }
    .badge-moto_llego { background:#2A1A0A; color:#FB923C; }
    .badge-completada { background:#0A2A0A; color:#4ADE80; }
    .badge-cancelada { background:#2A0A0A; color:#F87171; }

    .cc-ruta { font-size:12px; color:#888; margin-bottom:6px; }
    .cc-ruta strong { color:#ddd; }
    .cc-personas { display:flex; gap:8px; font-size:11px; color:#666; }
    .cc-personas span { background:#222; padding:3px 8px; border-radius:20px; }

    .moto-card {
      background:#1E1E1E; border-radius:12px; padding:12px 14px;
      margin-bottom:8px; border:1px solid #2A2A2A;
      display:flex; align-items:center; gap:10px;
    }
    .moto-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .moto-dot.on { background:#4ADE80; box-shadow:0 0 6px #4ADE80; }
    .moto-dot.off { background:#555; }
    .moto-nombre { font-size:13px; font-weight:600; color:#ddd; }
    .moto-sub { font-size:11px; color:#555; margin-top:2px; }
    .moto-rating { margin-left:auto; font-size:13px; color:#F5D800; font-weight:700; }

    /* MAP */
    .map-section { flex:1; display:flex; flex-direction:column; }
    #map { flex:1; }

    /* PANEL DETALLE */
    .detalle {
      background:#141414; border-top:1px solid #222;
      padding:16px 20px; max-height:300px; overflow-y:auto;
      display:none;
    }
    .detalle.show { display:block; }
    .det-title { font-size:14px; font-weight:700; color:#F5D800; margin-bottom:12px; }
    .det-row { display:flex; justify-content:space-between; margin-bottom:8px; font-size:13px; }
    .det-lbl { color:#555; }
    .det-val { color:#ddd; font-weight:600; }

    .acciones { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
    .btn-acc {
      padding:8px 14px; border-radius:8px; font-size:12px; font-weight:700;
      cursor:pointer; border:none;
    }
    .btn-acc.verde { background:#1A6B2F; color:#fff; }
    .btn-acc.amarillo { background:#F5D800; color:#1A1A1A; }
    .btn-acc.rojo { background:#7F1D1D; color:#FCA5A5; }
    .btn-acc.azul { background:#1E3A5F; color:#93C5FD; }
    .btn-acc.gris { background:#2A2A2A; color:#888; }

    /* Modal asignar */
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:200; align-items:center; justify-content:center; }
    .modal-overlay.show { display:flex; }
    .modal { background:#1E1E1E; border-radius:16px; padding:24px; width:90%; max-width:380px; border:1px solid #333; }
    .modal h3 { font-size:15px; font-weight:700; color:#F5D800; margin-bottom:16px; }
    .modal-moto {
      background:#141414; border-radius:10px; padding:12px;
      margin-bottom:8px; cursor:pointer; border:1px solid #2A2A2A;
      display:flex; align-items:center; gap:10px;
    }
    .modal-moto:hover { border-color:#F5D800; }
    .modal-close { width:100%; padding:10px; background:transparent; color:#888; border:1px solid #333; border-radius:8px; cursor:pointer; margin-top:12px; font-size:13px; }

    .toast {
      position:fixed; bottom:24px; right:24px;
      background:#F5D800; color:#1A1A1A; padding:10px 18px;
      border-radius:12px; font-size:13px; font-weight:700;
      z-index:300; display:none;
    }
    .toast.show { display:block; }
    .toast.rojo { background:#7F1D1D; color:#FCA5A5; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-logo">MOTO</div>
  <div class="login-sub">ALGARROBO · ADMIN</div>
  <div class="login-card">
    <h3>🔐 Panel de control</h3>
    <input type="password" id="clave-input" placeholder="Clave de acceso" onkeydown="if(event.key==='Enter') verificarClave()"/>
    <button class="btn-login" onclick="verificarClave()">Entrar al panel</button>
    <div class="login-error" id="login-error">Clave incorrecta</div>
  </div>
</div>

<!-- ADMIN -->
<div id="admin-screen">
  <header>
    <div class="header-brand">🏍️ MotoAlgarrobo <span>Panel Admin</span></div>
    <button class="btn-logout" onclick="salir()">Salir</button>
  </header>

  <div class="layout">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="stats-bar">
        <div class="stat-item"><div class="v" id="st-activas">0</div><div class="l">Activas</div></div>
        <div class="stat-item"><div class="v" id="st-motos">0</div><div class="l">Motos ON</div></div>
        <div class="stat-item"><div class="v" id="st-hoy">0</div><div class="l">Hoy</div></div>
        <div class="stat-item"><div class="v" id="st-ingresos">$0</div><div class="l">Ingresos</div></div>
      </div>

      <div class="tabs">
        <div class="tab active" id="tab-carreras" onclick="cambiarTab('carreras')">🚗 Carreras</div>
        <div class="tab" id="tab-motos" onclick="cambiarTab('motos')">🏍️ Motos</div>
      </div>

      <div class="lista" id="lista-content">
        <div style="text-align:center;color:#444;padding:40px 0;font-size:13px;">Cargando...</div>
      </div>
    </div>

    <!-- MAPA + DETALLE -->
    <div class="map-section">
      <div id="map"></div>
      <div class="detalle" id="detalle-panel"></div>
    </div>
  </div>
</div>

<!-- Modal asignar mototaxista -->
<div class="modal-overlay" id="modal-asignar">
  <div class="modal">
    <h3>Asignar mototaxista</h3>
    <div id="lista-motos-modal"></div>
    <button class="modal-close" onclick="cerrarModal()">Cancelar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, query, where, doc, updateDoc, getDoc, orderBy, limit, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ── Config Firebase (misma que firebase-config.js) ──
  // Lee desde el archivo de config del proyecto
  let db;
  async function initFirebase() {
    try {
      const mod = await import('./js/firebase-config.js');
      db = mod.db;
      return true;
    } catch(e) {
      console.error('Firebase config error:', e);
      return false;
    }
  }

  const CLAVE = 'Juanjo721@';
  let tabActual = 'carreras';
  let map, carreraSeleccionada = null;
  let marcadoresMotos = {}, marcadoresCarreras = {};
  let mototaxistasDisponibles = [];

  // ── LOGIN ──
  window.verificarClave = () => {
    const input = document.getElementById('clave-input').value;
    if (input === CLAVE) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-screen').style.display = 'block';
      arrancarAdmin();
    } else {
      document.getElementById('login-error').style.display = 'block';
      document.getElementById('clave-input').value = '';
    }
  };

  window.salir = () => {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('admin-screen').style.display = 'none';
    document.getElementById('clave-input').value = '';
  };

  async function arrancarAdmin() {
    const ok = await initFirebase();
    if (!ok) { mostrarToast('Error conectando Firebase', true); return; }
    initMap();
    escucharCarreras();
    escucharMototaxistas();
  }

  // ── MAPA ──
  function initMap() {
    map = L.map('map').setView([10.1628, -74.7277], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'© OSM' }).addTo(map);
  }

  // ── TABS ──
  window.cambiarTab = (tab) => {
    tabActual = tab;
    document.getElementById('tab-carreras').classList.toggle('active', tab === 'carreras');
    document.getElementById('tab-motos').classList.toggle('active', tab === 'motos');
    renderLista();
  };

  // ── DATOS ──
  let carreras = [], motos = [];

  function escucharCarreras() {
    const q = query(collection(db, 'carreras'), orderBy('createdAt', 'desc'), limit(50));
    onSnapshot(q, snap => {
      carreras = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      actualizarStats();
      renderLista();
      actualizarMapaCarreras();
    });
  }

  function escucharMototaxistas() {
    onSnapshot(collection(db, 'mototaxistas'), snap => {
      motos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      mototaxistasDisponibles = motos.filter(m => m.disponible);
      actualizarStats();
      renderLista();
      actualizarMapaMotos();
    });
  }

  function actualizarStats() {
    const activas = carreras.filter(c => !['completada','cancelada'].includes(c.estado)).length;
    const motosOn = motos.filter(m => m.disponible).length;
    const hoy = carreras.filter(c => c.estado === 'completada').length;
    const ingresos = carreras.filter(c => c.estado === 'completada').reduce((s,c) => s + (c.precio||0), 0);
    document.getElementById('st-activas').textContent = activas;
    document.getElementById('st-motos').textContent = motosOn;
    document.getElementById('st-hoy').textContent = hoy;
    document.getElementById('st-ingresos').textContent = '$' + ingresos.toLocaleString();
  }

  function renderLista() {
    const lista = document.getElementById('lista-content');
    if (tabActual === 'carreras') {
      if (!carreras.length) { lista.innerHTML = '<div style="text-align:center;color:#444;padding:40px 0;font-size:13px;">Sin carreras</div>'; return; }
      lista.innerHTML = carreras.map(c => `
        <div class="carrera-card ${carreraSeleccionada?.id === c.id ? 'selected' : ''}" onclick="selCarrera('${c.id}')">
          <div class="cc-top">
            <div class="cc-id">#${c.id.slice(0,8)}</div>
            <div class="cc-badge badge-${c.estado}">${estadoLabel(c.estado)}</div>
          </div>
          <div class="cc-ruta">📍 <strong>${c.origen||'--'}</strong></div>
          <div class="cc-ruta">🏁 <strong>${c.destino||'--'}</strong></div>
          <div class="cc-personas">
            <span>👤 ${c.clienteNombre||'Cliente'}</span>
            <span>🏍️ ${c.mototaxistaNombre||'Sin asignar'}</span>
            <span>$${(c.precio||0).toLocaleString()}</span>
          </div>
        </div>`).join('');
    } else {
      if (!motos.length) { lista.innerHTML = '<div style="text-align:center;color:#444;padding:40px 0;font-size:13px;">Sin mototaxistas</div>'; return; }
      lista.innerHTML = motos.map(m => `
        <div class="moto-card">
          <div class="moto-dot ${m.disponible ? 'on' : 'off'}"></div>
          <div>
            <div class="moto-nombre">${m.nombre||'Sin nombre'}</div>
            <div class="moto-sub">${m.placa||''} · ${m.carreras||0} carreras · ${m.disponible ? 'Disponible' : 'Ocupado'}</div>
          </div>
          <div class="moto-rating">★ ${(m.ranking||0).toFixed(1)}</div>
        </div>`).join('');
    }
  }

  function estadoLabel(e) {
    const m = { buscando:'Buscando', aceptada:'En camino', recogido:'Recogiendo', cliente_confirmo:'En curso', moto_llego:'Llegó', completada:'Completada', cancelada:'Cancelada' };
    return m[e] || e;
  }

  // ── SELECCIONAR CARRERA ──
  window.selCarrera = (id) => {
    carreraSeleccionada = carreras.find(c => c.id === id);
    renderLista();
    mostrarDetalle(carreraSeleccionada);
  };

  function mostrarDetalle(c) {
    const panel = document.getElementById('detalle-panel');
    panel.classList.add('show');
    const activas = ['buscando','aceptada','recogido','cliente_confirmo','moto_llego'].includes(c.estado);

    panel.innerHTML = `
      <div class="det-title">Carrera #${c.id.slice(0,8)} — ${estadoLabel(c.estado)}</div>
      <div class="det-row"><span class="det-lbl">Cliente</span><span class="det-val">${c.clienteNombre||'--'}</span></div>
      <div class="det-row"><span class="det-lbl">Mototaxista</span><span class="det-val">${c.mototaxistaNombre||'Sin asignar'}</span></div>
      <div class="det-row"><span class="det-lbl">Origen</span><span class="det-val">${c.origen||'--'}</span></div>
      <div class="det-row"><span class="det-lbl">Destino</span><span class="det-val">${c.destino||'--'}</span></div>
      <div class="det-row"><span class="det-lbl">Pasajeros</span><span class="det-val">${c.pasajeros||1}</span></div>
      <div class="det-row"><span class="det-lbl">Precio</span><span class="det-val">$${(c.precio||0).toLocaleString()}</span></div>
      <div class="acciones">
        ${activas ? `<button class="btn-acc amarillo" onclick="asignarMoto('${c.id}')">🏍️ Asignar mototaxista</button>` : ''}
        ${c.estado === 'buscando' ? `<button class="btn-acc verde" onclick="forzarEstado('${c.id}','aceptada')">▶ Forzar aceptada</button>` : ''}
        ${c.estado === 'aceptada' ? `<button class="btn-acc azul" onclick="forzarEstado('${c.id}','recogido')">▶ Forzar recogido</button>` : ''}
        ${c.estado === 'recogido' ? `<button class="btn-acc azul" onclick="forzarEstado('${c.id}','cliente_confirmo')">▶ Forzar en curso</button>` : ''}
        ${c.estado === 'cliente_confirmo' ? `<button class="btn-acc azul" onclick="forzarEstado('${c.id}','moto_llego')">▶ Forzar llegó</button>` : ''}
        ${c.estado === 'moto_llego' ? `<button class="btn-acc verde" onclick="forzarEstado('${c.id}','completada')">✓ Completar</button>` : ''}
        ${activas ? `<button class="btn-acc rojo" onclick="cancelarCarrera('${c.id}')">✕ Cancelar</button>` : ''}
        <button class="btn-acc gris" onclick="cerrarDetalle()">✕ Cerrar</button>
      </div>`;

    // Centrar mapa en carrera
    if (c.origenLat && c.origenLng) map.setView([c.origenLat, c.origenLng], 16);
  }

  window.cerrarDetalle = () => {
    document.getElementById('detalle-panel').classList.remove('show');
    carreraSeleccionada = null;
    renderLista();
  };

  // ── ACCIONES ADMIN ──
  window.forzarEstado = async (id, estado) => {
    await updateDoc(doc(db,'carreras',id), { estado, adminForzadoAt: serverTimestamp() });
    mostrarToast('Estado actualizado: ' + estadoLabel(estado));
    const c = carreras.find(x => x.id === id);
    if (c) { c.estado = estado; mostrarDetalle(c); }
  };

  window.cancelarCarrera = async (id) => {
    if (!confirm('¿Cancelar esta carrera?')) return;
    await updateDoc(doc(db,'carreras',id), { estado:'cancelada', canceladaAdminAt: serverTimestamp() });
    mostrarToast('Carrera cancelada', true);
    cerrarDetalle();
  };

  window.asignarMoto = (carreraId) => {
    const disponibles = mototaxistasDisponibles;
    const modal = document.getElementById('modal-asignar');
    const lista = document.getElementById('lista-motos-modal');
    if (!disponibles.length) {
      mostrarToast('No hay mototaxistas disponibles', true); return;
    }
    lista.innerHTML = disponibles.map(m => `
      <div class="modal-moto" onclick="confirmarAsignacion('${carreraId}','${m.id}','${m.nombre}')">
        <div class="moto-dot on"></div>
        <div>
          <div class="moto-nombre">${m.nombre}</div>
          <div class="moto-sub">${m.placa||''} · ★ ${(m.ranking||0).toFixed(1)}</div>
        </div>
      </div>`).join('');
    modal.classList.add('show');
  };

  window.confirmarAsignacion = async (carreraId, motoId, motoNombre) => {
    await updateDoc(doc(db,'carreras',carreraId), {
      estado: 'aceptada',
      mototaxistaId: motoId,
      mototaxistaNombre: motoNombre,
      aceptadaAt: serverTimestamp(),
      asignadoPorAdmin: true
    });
    await updateDoc(doc(db,'mototaxistas',motoId), { disponible: false });
    cerrarModal();
    mostrarToast('Asignado: ' + motoNombre);
    const c = carreras.find(x => x.id === carreraId);
    if (c) { c.estado = 'aceptada'; c.mototaxistaNombre = motoNombre; mostrarDetalle(c); }
  };

  window.cerrarModal = () => document.getElementById('modal-asignar').classList.remove('show');

  // ── MAPA MOTOS ──
  function actualizarMapaMotos() {
    motos.forEach(m => {
      if (!m.lat || !m.lng) return;
      const ico = L.divIcon({ html: m.disponible ? '🟢🏍️' : '🔴🏍️', className:'', iconSize:[36,24] });
      if (marcadoresMotos[m.id]) marcadoresMotos[m.id].setLatLng([m.lat, m.lng]);
      else marcadoresMotos[m.id] = L.marker([m.lat, m.lng], {icon:ico}).addTo(map).bindPopup(`${m.nombre} · ★${(m.ranking||0).toFixed(1)}`);
    });
  }

  function actualizarMapaCarreras() {
    carreras.filter(c => c.origenLat && !['completada','cancelada'].includes(c.estado)).forEach(c => {
      const ico = L.divIcon({ html:'📍', className:'', iconSize:[20,20] });
      if (!marcadoresCarreras[c.id])
        marcadoresCarreras[c.id] = L.marker([c.origenLat, c.origenLng], {icon:ico}).addTo(map)
          .bindPopup(`${c.clienteNombre} → ${c.destino}`);
    });
  }

  function mostrarToast(msg, rojo=false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.toggle('rojo', rojo);
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }
</script>
</body>
</html>
