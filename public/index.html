<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#1A6B2F"/>
  <title>MotoAlgarrobo</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="icon" href="img/icon.png"/>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Segoe UI', sans-serif; background:#1A6B2F; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; }

    .logo-wrap { text-align:center; margin-bottom:32px; }
    .logo-wrap svg { display:block; margin:0 auto 12px; }
    .logo-wrap .brand { font-size:32px; font-weight:800; color:#F5D800; letter-spacing:2px; font-family:Georgia,serif; }
    .logo-wrap .sub { font-size:14px; color:#fff; letter-spacing:6px; font-family:Georgia,serif; }

    .card { background:#fff; border-radius:24px; padding:28px 24px 32px; width:90%; max-width:340px; }
    .card p { font-size:13px; color:#5F5E5A; text-align:center; margin-bottom:20px; }

    label { font-size:12px; color:#5F5E5A; display:block; margin-bottom:4px; }
    input { width:100%; padding:11px 14px; border-radius:10px; border:1.5px solid #D3D1C7; font-size:14px; background:#F1EFE8; color:#2C2C2A; margin-bottom:14px; outline:none; }
    input:focus { border-color:#1A6B2F; }

    .btn-main { width:100%; padding:13px; background:#1A6B2F; color:#fff; border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; margin-bottom:10px; }
    .btn-main:active { opacity:0.85; }
    .btn-google { width:100%; padding:11px; background:#fff; color:#2C2C2A; border:1.5px solid #D3D1C7; border-radius:12px; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
    .btn-google:active { background:#F1EFE8; }

    .divider { display:flex; align-items:center; gap:10px; margin:14px 0; }
    .divider span { font-size:12px; color:#888780; }
    .divider::before,.divider::after { content:''; flex:1; height:1px; background:#D3D1C7; }

    .link-row { text-align:center; margin-top:14px; font-size:12px; color:#5F5E5A; }
    .link-row a { color:#1A6B2F; font-weight:700; text-decoration:none; }

    .moto-link { text-align:center; margin-top:12px; font-size:12px; }
    .moto-link a { color:#1A6B2F; font-weight:700; text-decoration:none; }

    .error { color:#E24B4A; font-size:12px; text-align:center; margin-bottom:10px; display:none; }
    .loading { opacity:0.6; pointer-events:none; }
  </style>
</head>
<body>

  <div class="logo-wrap">
    <svg width="90" height="62" viewBox="0 0 160 110">
      <circle cx="52" cy="78" r="22" fill="none" stroke="#fff" stroke-width="6"/>
      <circle cx="52" cy="78" r="4" fill="#fff"/>
      <circle cx="118" cy="78" r="18" fill="none" stroke="#fff" stroke-width="6"/>
      <circle cx="118" cy="78" r="4" fill="#fff"/>
      <path d="M58 76 L72 58 L100 55 L114 64 L116 76 Z" fill="#F5D800"/>
      <rect x="72" y="64" width="28" height="18" rx="3" fill="#1A6B2F" stroke="#fff" stroke-width="1.5"/>
      <path d="M100 64 L118 54 L122 55" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="122" cy="56" rx="5" ry="4" fill="#F5D800"/>
      <line x1="30" y1="68" x2="48" y2="68" stroke="#F5D800" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
      <line x1="27" y1="76" x2="46" y2="76" stroke="#F5D800" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    </svg>
    <div class="brand">MOTO</div>
    <div class="sub">ALGARROBO</div>
  </div>

  <div class="card">
    <p>Ingresa para continuar</p>
    <div class="error" id="error-msg">Correo o contraseña incorrectos</div>

    <label>Correo electrónico</label>
    <input type="email" id="email" placeholder="tucorreo@gmail.com"/>

    <label>Contraseña</label>
    <input type="password" id="password" placeholder="••••••••"/>

    <button class="btn-main" id="btn-login" onclick="loginEmail()">Entrar</button>

    <div class="divider"><span>o continúa con</span></div>

    <button class="btn-google" onclick="loginGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continuar con Google
    </button>

    <div class="link-row">¿No tienes cuenta? <a href="registro.html">Regístrate</a></div>
    <div class="moto-link"><a href="mototaxista.html">¿Eres mototaxista? Ingresa aquí</a></div>
  </div>

  <script type="module">
    import { auth } from './js/firebase-config.js';
    import {
      signInWithEmailAndPassword,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithRedirect,
      getRedirectResult,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // Detectar si es móvil
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    // Manejar resultado de redirect (escritorio)
    getRedirectResult(auth).then(result => {
      if (result?.user) window.location.href = 'cliente.html';
    }).catch(e => console.error(e));

    onAuthStateChanged(auth, user => {
      if (user) window.location.href = 'cliente.html';
    });

    window.loginEmail = async () => {
      const email = document.getElementById('email').value;
      const pass  = document.getElementById('password').value;
      const btn   = document.getElementById('btn-login');
      const err   = document.getElementById('error-msg');
      err.style.display = 'none';
      btn.classList.add('loading');
      btn.textContent = 'Entrando...';
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch(e) {
        err.style.display = 'block';
        btn.classList.remove('loading');
        btn.textContent = 'Entrar';
      }
    };

    window.loginGoogle = async () => {
      const provider = new GoogleAuthProvider();
      try {
        if (isMobile) {
          // Móvil: popup
          await signInWithPopup(auth, provider);
        } else {
          // Escritorio: redirect (evita el loop de popup bloqueado)
          await signInWithRedirect(auth, provider);
        }
      } catch(e) {
        console.error(e);
      }
    };
  </script>
</body>
</html>
